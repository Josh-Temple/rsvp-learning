name: Scheduled Vercel production deploy

on:
  schedule:
    - cron: "17 */6 * * *"
  # Updating this workflow on main also provides an intentional immediate-deploy path. Trigger: Daily Paper Listen Argo-Bench 2026-10-02.
  push:
    branches: [main]
    paths:
      - ".github/workflows/vercel-scheduled-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_imvRFeaSa1LmNpMJkFiMwNmB
      VERCEL_PROJECT_ID: prj_7yYGl5D3Q7UwQgQuXaGmOYLkTzbu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether main changed
        id: changed
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/vercel-production >/dev/null; then
            LAST_DEPLOYED="$(git rev-list -n 1 refs/tags/vercel-production)"
            if [ "$LAST_DEPLOYED" = "$GITHUB_SHA" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No changes since the last production deploy."
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check deployment credentials
        if: steps.changed.outputs.changed == 'true'
        id: credentials
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not configured; skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true' && steps.credentials.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Verify Vercel project access
        if: steps.changed.outputs.changed == 'true' && steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          HTTP_CODE="$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          echo "Vercel project access: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/vercel-project.json","utf8")); console.error(x?.error?.message || JSON.stringify(x));'
            exit 1
          fi

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true' && steps.credentials.outputs.configured == 'true'
        run: npm install --ignore-scripts

      - name: Test and validate
        if: steps.changed.outputs.changed == 'true' && steps.credentials.outputs.configured == 'true'
        run: npm run check

      - name: Create Vercel production deployment
        if: steps.changed.outputs.changed == 'true' && steps.credentials.outputs.configured == 'true'
        id: vercel_deploy
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const body = {
            name: "rsvp-learning",
            project: process.env.VERCEL_PROJECT_ID,
            target: "production",
            gitSource: {
              type: "github",
              org: "Josh-Temple",
              repo: "rsvp-learning",
              ref: "main"
            },
            gitMetadata: {
              remoteUrl: "https://github.com/Josh-Temple/rsvp-learning",
              commitRef: "main",
              commitSha: process.env.GITHUB_SHA,
              ci: true,
              ciType: "github-actions",
              ciGitRepoVisibility: "private"
            }
          };
          fs.writeFileSync("/tmp/vercel-deploy-request.json", JSON.stringify(body));
          NODE
          HTTP_CODE="$(curl -sS -o /tmp/vercel-deploy.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/vercel-deploy-request.json \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID")"
          echo "Create deployment: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/vercel-deploy.json","utf8")); console.error(x?.error?.message || JSON.stringify(x));'
            exit 1
          fi
          DEPLOYMENT_ID="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/vercel-deploy.json","utf8")); process.stdout.write(x.id || x.uid || "")')"
          DEPLOYMENT_URL="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/vercel-deploy.json","utf8")); process.stdout.write(x.url || "")')"
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Deployment response did not include an ID."
            cat /tmp/vercel-deploy.json
            exit 1
          fi
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Created deployment $DEPLOYMENT_ID"

      - name: Wait for Vercel production deployment
        if: steps.changed.outputs.changed == 'true' && steps.credentials.outputs.configured == 'true'
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.vercel_deploy.outputs.deployment_id }}
        run: |
          for attempt in $(seq 1 60); do
            HTTP_CODE="$(curl -sS -o /tmp/vercel-status.json -w "%{http_code}" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Deployment status lookup failed: HTTP $HTTP_CODE"
              exit 1
            fi
            READY_STATE="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/vercel-status.json","utf8")); process.stdout.write(x.readyState || x.status || "")')"
            echo "Vercel deployment state: $READY_STATE"
            case "$READY_STATE" in
              READY)
                exit 0
                ;;
              ERROR|CANCELED)
                node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/vercel-status.json","utf8")); console.error(JSON.stringify({id:x.id,url:x.url,readyState:x.readyState,status:x.status,errorMessage:x.errorMessage},null,2));'
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Vercel deployment."
          exit 1

      - name: Mark deployed commit
        if: steps.changed.outputs.changed == 'true' && steps.credentials.outputs.configured == 'true' && success()
        shell: bash
        run: |
          git tag -f vercel-production "$GITHUB_SHA"
          git push origin refs/tags/vercel-production --force
