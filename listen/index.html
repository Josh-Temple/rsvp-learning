<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2efe8" />
  <meta name="description" content="日常的に耳から取り入れるニュース・調査・レポートのListen一覧" />
  <title>Listen</title>
  <script>
    (() => {
      const saved = localStorage.getItem("rsvp:theme");
      const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="./listen.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <nav class="mode-nav" aria-label="学習モード">
        <a class="icon-link mode-text-link" href="../index.html" aria-label="RSVPへ移動">RSVP</a>
        <a class="icon-link mode-text-link" href="../index.html?library=learn" aria-label="Learn教材一覧へ移動">Learn</a>
        <a class="icon-link mode-text-link is-active" href="./" aria-label="Listen一覧" aria-current="page">Listen</a>
      </nav>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="テーマ切替">☾</button>
    </header>

    <h1 class="listen-page-title">Listen一覧</h1>
    <section id="listen-list" class="listen-list" aria-live="polite"></section>
  </main>

  <script src="./listen.js" type="module"></script>
</body>
</html>
