<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="theme-color" content="#f2efe8" />
  <meta name="description" content="Personal RSVP learning player" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="RSVP" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>RSVP</title>
  <script>
    (() => {
      const saved = localStorage.getItem("rsvp:theme");
      const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button id="library-open" class="brand" type="button" aria-label="ライブラリを開く">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <span class="brand-label">RSVP</span>
      </button>

      <div class="top-actions">
        <button id="current-lesson" class="current-lesson" type="button" aria-label="教材を選択">…</button>
        <a id="learn-link" class="mode-link icon-mode-link" href="./index.html?library=learn" aria-label="Learn教材一覧を開く" title="Learn">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 5.5c2.6-.8 5.3-.4 8 1.2v12c-2.7-1.6-5.4-2-8-1.2v-12Z" />
            <path d="M20 5.5c-2.6-.8-5.3-.4-8 1.2v12c2.7-1.6 5.4-2 8-1.2v-12Z" />
          </svg>
        </a>
        <a id="listen-link" class="mode-link icon-mode-link" href="./listen/" aria-label="Listenを開く" title="Listen">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 13v-1a8 8 0 0 1 16 0v1" />
            <path d="M4 13h3v7H5a1 1 0 0 1-1-1v-6Zm16 0h-3v7h2a1 1 0 0 0 1-1v-6Z" />
          </svg>
        </a>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="テーマ切替">☾</button>
      </div>
    </header>

    <section class="player" aria-label="RSVPプレイヤー">
      <button id="chunk-stage" class="chunk-stage" type="button" aria-label="再生・一時停止">
        <span id="chunk-text">…</span>
      </button>

      <div class="dock">
        <div class="progress-row">
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <span id="progress-text">0·0</span>
        </div>

        <div class="controls" aria-label="再生操作">
          <button id="back-five" type="button" aria-label="5チャンク戻る">−5</button>
          <button id="back-one" type="button" aria-label="1チャンク戻る">←</button>
          <button id="play-pause" class="play-button" type="button" aria-label="再生">▶</button>
          <button id="next-one" type="button" aria-label="1チャンク進む">→</button>
          <button id="restart" type="button" aria-label="最初へ戻る">↺</button>
        </div>

        <div class="speed-row">
          <span id="speed-label">1.0×</span>
          <input id="speed" type="range" min="0.6" max="10.0" value="1" step="0.1" aria-label="再生速度" />
          <details id="source-section" class="sources" hidden>
            <summary aria-label="出典">i</summary>
            <ul id="source-list"></ul>
          </details>
        </div>

        <div class="chapter-nav" aria-label="教材移動">
          <button id="prev-chapter" type="button" aria-label="前のチャプター">‹</button>
          <span id="chapter-position">01 / 01</span>
          <div id="mastery-control" class="mastery-control" aria-label="習熟度">
            <button type="button" data-level="1" aria-label="習熟度 1"></button>
            <button type="button" data-level="2" aria-label="習熟度 2"></button>
            <button type="button" data-level="3" aria-label="習熟度 3"></button>
          </div>
          <button id="next-chapter" type="button" aria-label="次のチャプター">›</button>
        </div>
      </div>
    </section>
  </main>

  <section id="library-overlay" class="library-overlay" role="dialog" aria-modal="true" aria-label="ライブラリ" hidden>
    <div class="library-shell">
      <header class="library-header">
        <div class="library-switch" role="group" aria-label="ライブラリモード">
          <button id="library-rsvp-mode" class="library-switch-button is-active" type="button" aria-label="RSVP教材" aria-pressed="true" title="RSVP">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button id="library-learn-mode" class="library-switch-button" type="button" aria-label="Learn教材" aria-pressed="false" title="Learn">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 5.5c2.6-.8 5.3-.4 8 1.2v12c-2.7-1.6-5.4-2-8-1.2v-12Z" />
              <path d="M20 5.5c-2.6-.8-5.3-.4-8 1.2v12c2.7-1.6 5.4-2 8-1.2v-12Z" />
            </svg>
          </button>
          <button id="library-listen-mode" class="library-switch-button" type="button" aria-label="Listenコンテンツ" aria-pressed="false" title="Listen">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 13v-1a8 8 0 0 1 16 0v1" />
              <path d="M4 13h3v7H5a1 1 0 0 1-1-1v-6Zm16 0h-3v7h2a1 1 0 0 0 1-1v-6Z" />
            </svg>
          </button>
        </div>
        <button id="library-close" type="button" aria-label="ライブラリを閉じる">×</button>
      </header>
      <div id="library-content" class="library-content"></div>
    </div>
  </section>

  <script src="./app.js" type="module"></script>
</body>
</html>
