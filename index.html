<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSVP Learning</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">RSVP LEARNING</p>
        <h1>学習教材を、ひとまとまりずつ読む</h1>
      </div>
      <label class="lesson-picker">
        <span>教材</span>
        <select id="lesson-select" aria-label="教材を選択"></select>
      </label>
    </header>

    <section class="lesson-meta" aria-live="polite">
      <div>
        <p id="lesson-topic" class="meta-label"></p>
        <h2 id="lesson-title">読み込み中...</h2>
        <p id="lesson-summary"></p>
      </div>
      <div class="progress-copy">
        <span id="progress-text">0 / 0</span>
      </div>
    </section>

    <section class="player" aria-label="RSVPプレイヤー">
      <div class="chunk-stage" role="status" aria-live="polite" aria-atomic="true">
        <p id="chunk-text">教材を選択してください</p>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="controls">
        <button id="back-five" type="button" title="5チャンク戻る">−5</button>
        <button id="back-one" type="button" title="1チャンク戻る">←</button>
        <button id="play-pause" class="primary" type="button">再生</button>
        <button id="next-one" type="button" title="1チャンク進む">→</button>
        <button id="restart" type="button">最初へ</button>
      </div>

      <div class="speed-control">
        <label for="speed">速度 <strong id="speed-label">1.0×</strong></label>
        <input id="speed" type="range" min="0.6" max="2.0" value="1" step="0.1" />
        <p id="timing-label">基本表示時間: -- ms</p>
      </div>
    </section>

    <section class="source-section">
      <details>
        <summary>出典</summary>
        <ul id="source-list"></ul>
      </details>
    </section>

    <footer class="help">
      <span>Space: 再生 / 一時停止</span>
      <span>← →: 1チャンク移動</span>
    </footer>
  </main>

  <script src="./app.js" type="module"></script>
</body>
</html>
