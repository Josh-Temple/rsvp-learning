<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="theme-color" content="#f2efe8" />
  <meta name="description" content="Personal RSVP learning player" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="RSVP" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>RSVP</title>
  <script>
    (() => {
      const saved = localStorage.getItem("rsvp:theme");
      const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="RSVP">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <span class="brand-label">RSVP</span>
      </div>

      <div class="top-actions">
        <select id="lesson-select" aria-label="教材を選択"></select>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="テーマ切替">☾</button>
      </div>
    </header>

    <section class="player" aria-label="RSVPプレイヤー">
      <button id="chunk-stage" class="chunk-stage" type="button" aria-label="再生・一時停止">
        <span id="chunk-text">…</span>
      </button>

      <div class="dock">
        <div class="progress-row">
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <span id="progress-text">0·0</span>
        </div>

        <div class="controls" aria-label="再生操作">
          <button id="back-five" type="button" aria-label="5チャンク戻る">−5</button>
          <button id="back-one" type="button" aria-label="1チャンク戻る">←</button>
          <button id="play-pause" class="play-button" type="button" aria-label="再生">▶</button>
          <button id="next-one" type="button" aria-label="1チャンク進む">→</button>
          <button id="restart" type="button" aria-label="最初へ戻る">↺</button>
        </div>

        <div class="speed-row">
          <span id="speed-label">1.0×</span>
          <input id="speed" type="range" min="0.6" max="2.0" value="1" step="0.1" aria-label="再生速度" />
          <details id="source-section" class="sources" hidden>
            <summary aria-label="出典">i</summary>
            <ul id="source-list"></ul>
          </details>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js" type="module"></script>
</body>
</html>
