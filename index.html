<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="theme-color" content="#f2efe8" />
  <meta name="description" content="Personal RSVP learning player" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="RSVP" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>RSVP</title>
  <script>
    (() => {
      const saved = localStorage.getItem("rsvp:theme");
      const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <nav class="primary-navigation" aria-label="学習モード">
        <button id="library-open" class="brand primary-nav-item is-active" type="button" aria-label="RSVP教材一覧を開く" aria-current="page">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-label">RSVP</span>
        </button>
        <a id="learn-link" class="mode-link primary-nav-item" href="./index.html?library=learn" aria-label="Learn教材一覧を開く">Learn</a>
        <a id="listen-link" class="mode-link primary-nav-item" href="./index.html?library=listen" aria-label="Listen一覧を開く">Listen</a>
      </nav>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="テーマ切替">☾</button>
    </header>
    <div class="lesson-selector">
      <button id="current-lesson" class="current-lesson" type="button" aria-label="教材を選ぶ">教材を選ぶ</button>
    </div>

    <section class="player" aria-label="RSVPプレイヤー">
      <button id="chunk-stage" class="chunk-stage" type="button" aria-label="再生・一時停止">
        <span id="chunk-text">…</span>
      </button>

      <div class="dock">
        <div class="progress-row">
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <span id="progress-text">0·0</span>
        </div>

        <div class="controls" aria-label="再生操作">
          <button id="back-five" type="button" aria-label="5チャンク戻る">−5</button>
          <button id="back-one" type="button" aria-label="1チャンク戻る">←</button>
          <button id="play-pause" class="play-button" type="button" aria-label="再生">▶</button>
          <button id="next-one" type="button" aria-label="1チャンク進む">→</button>
          <button id="restart" type="button" aria-label="最初へ戻る">↺</button>
        </div>

        <div class="speed-row">
          <span id="speed-label">1.0×</span>
          <input id="speed" type="range" min="0.6" max="10.0" value="1" step="0.1" aria-label="再生速度" />
          <details id="source-section" class="sources" hidden>
            <summary aria-label="出典">i</summary>
            <ul id="source-list"></ul>
          </details>
        </div>

        <div class="chapter-nav" aria-label="教材移動">
          <button id="prev-chapter" type="button" aria-label="前のチャプター">‹</button>
          <span id="chapter-position">01 / 01</span>
          <div id="mastery-control" class="mastery-control" aria-label="習熟度">
            <button type="button" data-level="1" aria-label="習熟度 1"></button>
            <button type="button" data-level="2" aria-label="習熟度 2"></button>
            <button type="button" data-level="3" aria-label="習熟度 3"></button>
          </div>
          <button id="next-chapter" type="button" aria-label="次のチャプター">›</button>
        </div>
      </div>
    </section>
  </main>

  <section id="library-overlay" class="library-overlay" role="dialog" aria-modal="true" aria-label="ライブラリ" hidden>
    <div class="library-shell">
      <header class="library-header">
        <div class="library-switch" role="group" aria-label="教材一覧の種類">
          <button id="library-rsvp-mode" class="library-switch-button is-active" type="button" aria-label="RSVP教材一覧" aria-pressed="true">RSVP</button>
          <button id="library-learn-mode" class="library-switch-button" type="button" aria-label="Learn教材一覧" aria-pressed="false">Learn</button>
          <button id="library-listen-mode" class="library-switch-button" type="button" aria-label="Listen一覧" aria-pressed="false">Listen</button>
        </div>
        <button id="library-close" type="button" aria-label="RSVPプレイヤーへ戻る">← RSVPへ</button>
      </header>
      <div id="library-content" class="library-content"></div>
    </div>
  </section>


  <section id="learn-course-player" class="learn-course-player" aria-label="Learnコース連続再生" hidden>
    <div class="learn-course-shell">
      <header class="learn-course-player-header">
        <button id="learn-course-back" type="button" aria-label="Learn教材一覧へ戻る">← 一覧へ</button>
        <div class="learn-course-player-heading">
          <span>LEARN · COURSE</span>
          <strong id="learn-course-title">コース</strong>
        </div>
        <span id="learn-course-position">01 / 01</span>
      </header>

      <section id="learn-course-reader" class="learn-course-reader" aria-label="コース読み上げプレイヤー">
        <div class="learn-course-reader-row">
          <button id="learn-course-prev" type="button" aria-label="前の章">‹</button>
          <button id="learn-course-play" type="button" aria-label="読み上げを開始">▶</button>
          <button id="learn-course-pause" type="button" aria-label="一時停止" disabled>Ⅱ</button>
          <button id="learn-course-stop" type="button" aria-label="停止" disabled>■</button>
          <button id="learn-course-next" type="button" aria-label="次の章">›</button>
          <details class="learn-reader-options">
            <summary aria-label="読み上げ設定">設定</summary>
            <div class="learn-reader-options-panel">
              <select id="learn-course-voice" aria-label="読み上げ音声"></select>
              <label class="learn-course-speed">
                <span id="learn-course-rate-label">1.0×</span>
                <input id="learn-course-rate" type="range" min="0.7" max="4.0" value="1" step="0.1" aria-label="読み上げ速度" />
              </label>
            </div>
          </details>
        </div>
        <div id="learn-course-status" class="learn-course-status" role="status" aria-live="polite">コースを選択してください</div>
      </section>

      <article id="learn-course-article" class="learn-course-article" aria-live="off"></article>
      <section id="learn-course-sources" class="learn-course-sources" aria-label="この章の出典" hidden></section>
    </div>
  </section>

  <script src="./learn/course-player.js" defer></script>
  <script src="./app.js" type="module"></script>
</body>
</html>
